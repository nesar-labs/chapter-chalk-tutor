<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 100" width="100%" height="100%">
  <defs>
    <!-- Yellow Chalk Gradient matching your UI button -->
    <linearGradient id="chalkYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Optional Dark Background Preview (matches your site theme) -->
  <rect width="100%" height="100%" fill="#1b3022" rx="12"/>

  <!-- Icon: Stylized Chalkboard + Pencil/Chalk Accent -->
  <g transform="translate(18, 18)">
    <!-- Miniature Chalkboard Frame -->
    <rect x="2" y="2" width="60" height="60" rx="8" fill="none" stroke="#f5c05c" stroke-width="3" stroke-dasharray="6 3" opacity="0.4"/>
    <rect x="8" y="8" width="48" height="48" rx="4" fill="#142318" stroke="#f5c05c" stroke-width="2"/>
    
    <!-- Chalk strokes inside board -->
    <line x1="16" y1="20" x2="36" y2="20" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <line x1="16" y1="32" x2="44" y2="32" stroke="#f5c05c" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <line x1="16" y1="44" x2="28" y2="44" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Small floating chalk piece / pencil nib overlay -->
    <path d="M52 10 L58 16 L38 36 L32 36 Z" fill="url(#chalkYellow)"/>
  </g>

  <!-- Typography -->
  <text x="92" y="47" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="26" fill="#ffffff" letter-spacing="0.5">
    Chapter <tspan fill="#f5c05c">Chalk</tspan>
  </text>
  <text x="94" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12" fill="#94a3b8" letter-spacing="3.5">
    YOUR BOARD, READY
  </text>
</svg>
